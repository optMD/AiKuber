        {"type":"stat","title":"P95 задержка","gridPos":{"h":5,"w":6,"x":18,"y":2},"targets":[{"expr":"histogram_quantile(0.95, sum(rate(ai_request_latency_seconds_bucket[5m])) by (le))","refId":"A"}],"options":{"colorMode":"background","graphMode":"area","justifyMode":"center","orientation":"auto","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"textMode":"value_and_name"},"fieldConfig":{"defaults":{"unit":"s","decimals":2,"color":{"mode":"thresholds"},"thresholds":{"mode":"absolute","steps":[{"color":"green","value":null},{"color":"orange","value":2},{"color":"red","value":5}]}},"overrides":[]}},
