        {"type":"timeseries","title":"Задержка ответа: p50 / p95 / p99","gridPos":{"h":9,"w":10,"x":14,"y":7},"targets":[{"expr":"histogram_quantile(0.50, sum(rate(ai_request_latency_seconds_bucket[5m])) by (le))","legendFormat":"p50","refId":"A"},{"expr":"histogram_quantile(0.95, sum(rate(ai_request_latency_seconds_bucket[5m])) by (le))","legendFormat":"p95","refId":"B"},{"expr":"histogram_quantile(0.99, sum(rate(ai_request_latency_seconds_bucket[5m])) by (le))","legendFormat":"p99","refId":"C"}],"options":{"legend":{"calcs":["lastNotNull","max"],"displayMode":"table","placement":"right"},"tooltip":{"mode":"multi","sort":"desc"}},"fieldConfig":{"defaults":{"unit":"s","lineWidth":3,"fillOpacity":12,"color":{"mode":"palette-classic"},"custom":{"drawStyle":"line","lineInterpolation":"smooth","showPoints":"never","spanNulls":true}},"overrides":[]}},
        {"type":"timeseries","title":"Внешний API модели","gridPos":{"h":8,"w":12,"x":0,"y":16},"targets":[{"expr":"sum by (status) (rate(ai_upstream_requests_total[5m]))","legendFormat":"ответ {{status}}","refId":"A"},{"expr":"rate(ai_upstream_retries_total[5m])","legendFormat":"повторы","refId":"B"}],"options":{"legend":{"calcs":["lastNotNull","max"],"displayMode":"table","placement":"right"},"tooltip":{"mode":"multi","sort":"desc"}},"fieldConfig":{"defaults":{"unit":"reqps","lineWidth":3,"fillOpacity":18,"color":{"mode":"palette-classic"},"custom":{"drawStyle":"line","lineInterpolation":"smooth","showPoints":"never","spanNulls":true}},"overrides":[]}},
