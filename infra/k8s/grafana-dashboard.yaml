        {"type":"text","title":"","gridPos":{"h":2,"w":24,"x":0,"y":0},"options":{"mode":"markdown","content":"# AI Inference\nМониторинг качества ответа, кэша, внешнего API и состояния Kubernetes"}},
        {"type":"stat","title":"Запросы / мин","gridPos":{"h":5,"w":6,"x":0,"y":2},"targets":[{"expr":"sum(rate(ai_requests_total[5m])) * 60","refId":"A"}],"options":{"colorMode":"background","graphMode":"area","justifyMode":"center","orientation":"auto","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"textMode":"auto"},"fieldConfig":{"defaults":{"unit":"reqpm","decimals":1,"color":{"mode":"thresholds"},"thresholds":{"mode":"absolute","steps":[{"color":"blue","value":null},{"color":"green","value":1},{"color":"orange","value":30}]}},"overrides":[]}},
